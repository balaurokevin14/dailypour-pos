<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Daily Pour</title>

<!-- Home-screen + browser icons -->
<link rel="apple-touch-icon" sizes="180x180" href="https://balaurokevin14.github.io/dailypour-pos/apple-touch-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://balaurokevin14.github.io/dailypour-pos/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="https://balaurokevin14.github.io/dailypour-pos/favicon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="canonical" href="https://balaurokevin14.github.io/dailypour-pos/app/">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Pour">
<!-- status bar sits on the pink header colour instead of a white blur -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E08CA2">

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E08CA2; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  /* pink strip behind the phone's status bar (time, battery) */
  .bar { position: fixed; top: 0; left: 0; right: 0; height: var(--top, 0px); background: #E08CA2; }
  /* the app's box: a plain div stretches between top and bottom (an iframe alone does not) */
  #wrap { position: fixed; left: 0; right: 0; top: var(--top, 0px); bottom: 0; background: #E08CA2; }
  #wrap iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <div class="bar"></div>
  <!-- Paste your Apps Script Web app URL (ends in /exec) between the quotes -->
  <div id="wrap">
    <iframe src="https://script.google.com/macros/s/AKfycbyr2RGYJMJFMJvvQ6_gbqHOPBBzfOYnhE5unI3w9GET4uUoLpXx5cpwmn60ELEXCH0C/exec" title="The Daily Pour" allow="clipboard-write; web-share"></iframe>
  </div>
  <script>
    // Leave room for the status bar only when the page really draws under it
    // (the page is then as tall as the whole screen). On iOS 26.1+ home-screen apps
    // start below the status bar but still report its height; using it there
    // pushed the app down and caused the gap.
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top);visibility:hidden;pointer-events:none';
    document.body.appendChild(probe);
    function fit() {
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      var landscape = window.innerWidth > window.innerHeight;
      var screenH = landscape ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
      var under = standalone && !landscape && window.innerHeight >= screenH - 2;
      document.documentElement.style.setProperty('--top', (under ? probe.offsetHeight : 0) + 'px');
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
    window.addEventListener('pageshow', fit);

    // block pinch-zoom on iPhone (Safari ignores user-scalable=no)
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
      document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
    });
  </script>
</body>
</html>
