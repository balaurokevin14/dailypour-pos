<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Daily Pour</title>

<!-- Home-screen + browser icons -->
<link rel="apple-touch-icon" sizes="180x180" href="https://balaurokevin14.github.io/dailypour-pos/apple-touch-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://balaurokevin14.github.io/dailypour-pos/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="https://balaurokevin14.github.io/dailypour-pos/favicon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Pour">
<!-- "default": the phone keeps the app below its status bar (same as the old POS icon).
     "black-translucent" is broken on iOS 26.1+: the app slides under the time/battery,
     gets blurred and comes up short at the bottom. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E08CA2">

<style>
  html, body { margin: 0; background: #E08CA2; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  /* the page is 2px taller than the screen so iPhone's "tap the status bar to scroll up" has
     something to scroll; the app itself stays fixed and full-screen */
  html { height: 100%; }
  body { height: calc(100% + 2px); }
  /* the app fills the whole page; pink so iOS tints the status bar pink (it takes the colour at the top) */
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: #E08CA2; }
</style>
</head>
<body>
  <!-- Paste your Apps Script Web app URL (ends in /exec) between the quotes -->
  <iframe src="https://script.google.com/macros/s/AKfycbyr2RGYJMJFMJvvQ6_gbqHOPBBzfOYnhE5unI3w9GET4uUoLpXx5cpwmn60ELEXCH0C/exec" title="The Daily Pour" allow="clipboard-write; web-share"></iframe>
  <script>
    // Tap the status bar (time / battery) → scroll the app to the top.
    // iPhone only scrolls this outer page when the status bar is tapped, so we keep it 2px down;
    // when it jumps back to the top we tell the app (inside Google's frames) to scroll up too.
    (function () {
      var frame = document.querySelector('iframe'), armed = false;
      function arm() { window.scrollTo(0, 2); armed = window.scrollY > 0; }
      function tell(win, depth) {
        try { win.postMessage({ tdp: 'scrollTop' }, '*'); } catch (e) {}
        if (depth > 4) return;
        try { for (var i = 0; i < win.length; i++) tell(win[i], depth + 1); } catch (e) {}
      }
      window.addEventListener('scroll', function () {
        if (armed && window.scrollY <= 0) {
          armed = false;
          tell(frame.contentWindow, 0);
          setTimeout(arm, 450);
        }
      }, { passive: true });
      window.addEventListener('load', function () { setTimeout(arm, 300); });
      window.addEventListener('pageshow', function () { setTimeout(arm, 300); });
      window.addEventListener('resize', function () { setTimeout(arm, 300); });
    })();

    // block pinch-zoom on iPhone (Safari ignores user-scalable=no)
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
      document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
    });
  </script>
</body>
</html>
